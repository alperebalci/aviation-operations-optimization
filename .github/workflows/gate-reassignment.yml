name: Dynamic gate reassignment

on:
  push:
    branches: [main]
    paths:
      - "projects/airport-dynamic-gate-reassignment/**"
      - ".github/workflows/gate-reassignment.yml"
  pull_request:
    paths:
      - "projects/airport-dynamic-gate-reassignment/**"
      - ".github/workflows/gate-reassignment.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: projects/airport-dynamic-gate-reassignment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/airport-dynamic-gate-reassignment/pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest
