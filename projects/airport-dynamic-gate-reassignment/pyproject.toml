[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airport-dynamic-gate-reassignment"
version = "0.1.0"
description = "Rolling-horizon airport gate assignment with disruption-aware MILP reoptimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[project.scripts]
airport-gate-replan = "airport_gate_reassignment.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
